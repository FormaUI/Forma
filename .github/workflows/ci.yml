# Runs the same gate a person runs, on both the platform the library is developed on and the one a
# contributor is most likely to use. The gate itself lives in the repository, not here, so the two
# cannot drift: this file installs a toolchain and invokes one script.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A run superseded before it finished is answering about a tree that no longer exists, whichever branch
  # it was on. Pushes arrive in bursts here, so cancelling is what keeps the gate reporting on the commit
  # anyone is actually waiting for. The cost is that a commit passed over mid-burst is never judged on its
  # own, which matters only to a bisect that reaches for it later.
  cancel-in-progress: true

permissions:
  contents: read
  # On a pull request the change detection below reads the changed files through the API rather than
  # from git, which this scope is what allows.
  pull-requests: read
  # The locale lint is a tool the organization publishes to its own private feed.
  packages: read

jobs:
  gate:
    name: gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      # One platform failing is the interesting case, so the other is allowed to finish and say so.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      # A commit touching only prose still reports a passing check, so a branch protected on this job
      # stays satisfied without a toolchain being installed to read a paragraph.
      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: |
            code:
              - '**/*'
              - '!**/*.md'
              - '!docs/**'
              - '!assets/**'
              - '!.github/ISSUE_TEMPLATE/**'

      # The pinned SDK, read from the pin itself rather than restated here where it could fall behind it.
      - name: Set up .NET
        if: steps.filter.outputs.code == 'true'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up Node
        if: steps.filter.outputs.code == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/Forma.Blazor.Tests.Scripts/package-lock.json

      # The WebView checks drive Blazor Hybrid's web views through WebView2, whose runtime an image may lack; the
      # evergreen bootstrapper installs the current one, and the run names the version it checked against.
      - name: Install the WebView2 runtime
        if: steps.filter.outputs.code == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $version = if (Test-Path $key) { (Get-ItemProperty $key).pv } else { $null }
          if ([string]::IsNullOrEmpty($version) -or $version -eq '0.0.0.0') {
              $setup = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
              Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $setup
              Start-Process -FilePath $setup -ArgumentList '/silent', '/install' -Wait
              $version = (Get-ItemProperty $key).pv
          }
          "WebView2 runtime $version"

      - name: Run the gate
        if: steps.filter.outputs.code == 'true'
        env:
          NuGetPackageSourceCredentials_formaui: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }}
        run: pwsh ./build.ps1

      # The build decides what runs, and only this checks that decision. A step that quietly ran nothing
      # would look exactly like one that passed, which is how the task programs went unbuilt for weeks.
      - name: Check the build entry point
        if: steps.filter.outputs.code == 'true'
        run: pwsh ./scripts/build/build.tests.ps1

      - name: Report the gate was not needed
        if: steps.filter.outputs.code != 'true'
        run: echo 'Only prose changed, so the gate did not need to run.'
