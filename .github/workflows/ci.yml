# Runs the same gate a person runs, on both the platform the library is developed on and the one a
# contributor is most likely to use. The gate itself lives in the repository, not here, so the two
# cannot drift: this file installs a toolchain and invokes one script.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A run superseded before it finished is answering about a tree that no longer exists, whichever branch
  # it was on. Pushes arrive in bursts here, so cancelling is what keeps the gate reporting on the commit
  # anyone is actually waiting for. The cost is that a commit passed over mid-burst is never judged on its
  # own, which matters only to a bisect that reaches for it later.
  cancel-in-progress: true

permissions:
  contents: read
  # On a pull request the change detection below reads the changed files through the API rather than
  # from git, which this scope is what allows.
  pull-requests: read
  # The locale lint is a tool the organization publishes to its own private feed.
  packages: read

jobs:
  gate:
    name: gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      # One platform failing is the interesting case, so the other is allowed to finish and say so.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      # A commit touching only prose still reports a passing check, so a branch protected on this job
      # stays satisfied without a toolchain being installed to read a paragraph.
      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: |
            code:
              - '**/*'
              - '!**/*.md'
              - '!docs/**'
              - '!assets/**'
              - '!.github/ISSUE_TEMPLATE/**'

      # The pinned SDK, read from the pin itself rather than restated here where it could fall behind it.
      - name: Set up .NET
        if: steps.filter.outputs.code == 'true'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up Node
        if: steps.filter.outputs.code == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/Forma.Blazor.Tests.Scripts/package-lock.json

      # The WebView checks drive Blazor Hybrid's web views through WebView2, whose runtime an image may lack; the
      # evergreen bootstrapper installs the current one, and the run names the version it checked against and the
      # policies the image sets on Edge and WebView2, which decide which of the checks' browser arguments it takes.
      - name: Install the WebView2 runtime
        if: steps.filter.outputs.code == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $version = if (Test-Path $key) { (Get-ItemProperty $key).pv } else { $null }
          if ([string]::IsNullOrEmpty($version) -or $version -eq '0.0.0.0') {
              $setup = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
              Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $setup
              Start-Process -FilePath $setup -ArgumentList '/silent', '/install' -Wait
              $version = (Get-ItemProperty $key).pv
          }
          "WebView2 runtime $version"
          foreach ($policy in 'HKLM:\SOFTWARE\Policies\Microsoft\Edge', 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2', 'HKCU:\SOFTWARE\Policies\Microsoft\Edge') {
              if (Test-Path $policy) {
                  "Policies under $policy"
                  Get-ItemProperty $policy | Format-List | Out-String
              }
          }

      # The MAUI example host builds against the maui-windows workload, which the SDK set up above comes without.
      - name: Install the MAUI workload
        if: steps.filter.outputs.code == 'true' && runner.os == 'Windows'
        run: dotnet workload install maui-windows

      # WebView2 on the runner ignores the environment variables the check opens an application's DevTools through; its policy for each
      # example host's executable names the port instead, and the check reads the ports back.
      - name: Open the example hosts' DevTools through WebView2's policy
        if: steps.filter.outputs.code == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'
          New-Item -Path $key -Force | Out-Null
          $ports = [ordered]@{ 'Forma.Examples.Wpf' = 9311; 'Forma.Examples.WindowsForms' = 9312; 'Forma.Examples.Maui' = 9313 }
          foreach ($example in $ports.Keys) {
              Set-ItemProperty -Path $key -Name "$example.exe" -Value "--remote-debugging-port=$($ports[$example])"
          }
          "FORMA_WEBVIEW_POLICY_PORTS=$(($ports.Keys | ForEach-Object { "$_=$($ports[$_])" }) -join ';')" >> $env:GITHUB_ENV

      - name: Run the gate
        if: steps.filter.outputs.code == 'true'
        env:
          NuGetPackageSourceCredentials_formaui: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }}
        run: pwsh ./build.ps1

      # The build decides what runs, and only this checks that decision. A step that quietly ran nothing
      # would look exactly like one that passed, which is how the task programs went unbuilt for weeks.
      - name: Check the build entry point
        if: steps.filter.outputs.code == 'true'
        run: pwsh ./scripts/build/build.tests.ps1

      - name: Report the gate was not needed
        if: steps.filter.outputs.code != 'true'
        run: echo 'Only prose changed, so the gate did not need to run.'

  # A Blazor Hybrid application on a phone, a tablet or a Mac builds from Forma's packages on the platform's own
  # machine, Android's on Linux and Apple's on a Mac, each with the MAUI workload for its platform, which the gate's
  # machines have no use for.
  mobile:
    name: mobile (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Android
            os: ubuntu-latest
            workload: maui-android
          - platform: iOS
            os: macos-latest
            workload: maui-ios
          - platform: MacCatalyst
            os: macos-latest
            workload: maui-maccatalyst

    steps:
      - uses: actions/checkout@v7

      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: |
            code:
              - '**/*'
              - '!**/*.md'
              - '!docs/**'
              - '!assets/**'
              - '!.github/ISSUE_TEMPLATE/**'

      - name: Set up .NET
        if: steps.filter.outputs.code == 'true'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Apple's workloads build with the Xcode their release asks for, which for a preview of .NET is a preview of Xcode,
      # so the newest the image carries is chosen, a beta included, and the run names every one it had to choose from.
      - name: Select the newest Xcode
        if: steps.filter.outputs.code == 'true' && runner.os == 'macOS'
        run: |
          ls -d /Applications/Xcode*.app
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Install the platform's MAUI workload
        if: steps.filter.outputs.code == 'true'
        run: dotnet workload install ${{ matrix.workload }}

      # The newest image carries Xcode 26.6 while the release candidate's Apple workloads ask for Xcode 27, so their
      # check of the Xcode version is skipped, as MSBuild reads the environment, and the newest Xcode builds them.
      - name: Build the MAUI example host for the platform
        if: steps.filter.outputs.code == 'true'
        env:
          NuGetPackageSourceCredentials_formaui: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }}
          ValidateXcodeVersion: ${{ runner.os == 'macOS' && 'false' || '' }}
        run: pwsh ./scripts/build/mobile.ps1 -Platform ${{ matrix.platform }}

      - name: Report the build was not needed
        if: steps.filter.outputs.code != 'true'
        run: echo 'Only prose changed, so the mobile build did not need to run.'
