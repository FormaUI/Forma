# Runs the full gate on every platform a release is held to: Linux's and Windows' gates,
# WebView2 among Windows', and Android's checks on an emulator, the components in its web view and the MAUI example.
# A push to candidate runs it on the candidate, whose run a promotion to main and a release require to have passed for
# the exact commit, and whose Linux gate keeps the packages it packed and checked, which the release publishes as they
# are; the nightly run on dev surfaces an integration regression before a candidate is selected, checking one commit and
# running the browser check three times on Linux and on Windows so a check that fails sometimes shows as a rate, and a
# run dispatched by hand is a nightly run of the branch it's dispatched on. Every job keeps its checks' results. The gates
# themselves live in the repository, not here: this file installs a toolchain and invokes the scripts.
name: Full

on:
  push:
    branches: [candidate]
  schedule:
    # Every night, UTC.
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  # A candidate superseded before its run finished is no longer the one to approve.
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The commit every job checks, resolved once so a branch moving during the run changes nothing: the candidate's for a
  # push, dev's tip for the nightly run, which GitHub schedules from the default branch's workflow, and the dispatched
  # branch's tip for a run dispatched by hand.
  commit:
    name: commit
    runs-on: ubuntu-latest

    outputs:
      sha: ${{ steps.resolve.outputs.sha }}

    steps:
      - name: Resolve the commit every job checks
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          HEAD: ${{ github.sha }}
        run: |
          if [ "$EVENT" = schedule ]; then
            sha=$(gh api "repos/$REPOSITORY/commits/dev" --jq .sha)
          else
            sha=$HEAD
          fi
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "No commit resolved: '$sha'"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Checking $sha" >> "$GITHUB_STEP_SUMMARY"

  # The gate on each platform, and on the nightly run two more runs of its browser check, on runners of their own.
  gate:
    name: ${{ matrix.attempt == 1 && format('gate ({0})', matrix.os) || format('browser ({0}, run {1})', matrix.os, matrix.attempt) }}
    needs: commit
    runs-on: ${{ matrix.os }}

    strategy:
      # One platform failing is the interesting case, so the other is allowed to finish and say so.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        attempt: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '[1, 2, 3]' || '[1]') }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.commit.outputs.sha }}

      # The pinned SDK, read from the pin itself rather than restated here where it could fall behind it.
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/scripts/package-lock.json

      # The WebView checks drive Blazor Hybrid's web views through WebView2, whose runtime an image may lack; the
      # evergreen bootstrapper installs the current one, and the run names the version it checked against and the
      # policies the image sets on Edge and WebView2, which decide which of the checks' browser arguments it takes.
      - name: Install the WebView2 runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $version = if (Test-Path $key) { (Get-ItemProperty $key).pv } else { $null }
          if ([string]::IsNullOrEmpty($version) -or $version -eq '0.0.0.0') {
              $setup = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
              Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $setup
              Start-Process -FilePath $setup -ArgumentList '/silent', '/install' -Wait
              $version = (Get-ItemProperty $key).pv
          }
          "WebView2 runtime $version"
          foreach ($policy in 'HKLM:\SOFTWARE\Policies\Microsoft\Edge', 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2', 'HKCU:\SOFTWARE\Policies\Microsoft\Edge') {
              if (Test-Path $policy) {
                  "Policies under $policy"
                  Get-ItemProperty $policy | Format-List | Out-String
              }
          }

      # The MAUI example host builds against the maui-windows workload, which the SDK set up above comes without.
      - name: Install the MAUI workload
        if: runner.os == 'Windows'
        run: dotnet workload install maui-windows

      # WebView2 on the runner ignores the environment variables the check opens an application's DevTools through; its policy for each
      # example host's executable names the port instead, and the check reads the ports back.
      - name: Open the example hosts' DevTools through WebView2's policy
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'
          New-Item -Path $key -Force | Out-Null
          $ports = [ordered]@{ 'Forma.Examples.Wpf' = 9311; 'Forma.Examples.WinForms' = 9312; 'Forma.Examples.Maui' = 9313 }
          foreach ($example in $ports.Keys) {
              Set-ItemProperty -Path $key -Name "$example.exe" -Value "--remote-debugging-port=$($ports[$example])"
          }
          "FORMA_WEBVIEW_POLICY_PORTS=$(($ports.Keys | ForEach-Object { "$_=$($ports[$_])" }) -join ';')" >> $env:GITHUB_ENV

      - name: Run the gate
        if: matrix.attempt == 1
        run: pwsh ./build.ps1

      - name: Run the browser check again
        if: matrix.attempt != 1
        run: pwsh ./scripts/build/browser.ps1

      # A job that failed says so beside its results, so the nightly report finds a failure outside the checks too; a job
      # that ran out of time is cancelled rather than failed, and says so as well.
      - name: Note the job's failure
        if: failure() || cancelled()
        shell: pwsh
        run: New-Item -ItemType File -Force -Path 'artifacts/browser/results/job-failed' | Out-Null

      # Each run's results, read beside the other runs' by the nightly report.
      - name: Keep the checks' results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: checks-gate-${{ runner.os == 'Windows' && 'windows' || 'linux' }}-${{ matrix.attempt }}
          path: artifacts/browser/results
          if-no-files-found: ignore
          retention-days: 14

      # The packages the candidate's gate packed, built the examples from and checked, kept for its release.
      - name: Keep the candidate's packages
        if: github.event_name == 'push' && runner.os == 'Linux' && matrix.attempt == 1
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/browser/packages
          if-no-files-found: error
          retention-days: 90

  # A Blazor Hybrid application on a phone or a tablet builds from Forma's packages on the platform's own machine, with
  # the MAUI workload for its platform, which the gate's machines have no use for. Android's builds on Linux; Apple's
  # need the Xcode their workloads name, which no hosted Mac carries yet, so `mobile.ps1` builds them on a Mac by hand.
  mobile:
    name: mobile (${{ matrix.platform }})
    needs: commit
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Android
            os: ubuntu-latest
            workload: maui-android

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.commit.outputs.sha }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # The workload unpacks its packs into the temp directory, which on a hosted Linux machine is too small for Android's.
      - name: Install the platform's MAUI workload
        env:
          TMPDIR: ${{ runner.temp }}
        run: dotnet workload install ${{ matrix.workload }}

      # The mobile step drives the Android build on the device adb reaches, booted before the step starts.
      - name: Start an Android emulator
        if: matrix.platform == 'Android'
        uses: ./.github/actions/android-emulator

      - name: Build the MAUI example host for the platform
        run: pwsh ./scripts/build/mobile.ps1 -Platform ${{ matrix.platform }}

      # The mobile step builds without driving where adb reaches no device, as on a machine without one; here the
      # emulator was started for it, so its smoke checks' results are what the job is for.
      - name: Require the smoke checks' results
        if: matrix.platform == 'Android'
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath 'artifacts/browser/mobile-results/run-1/maui.json')) {
              throw "The MAUI example's smoke checks wrote no results; adb reached no device to drive them on."
          }

      # A device that went unreachable is described where it happened: its process, the runner's memory and its log.
      - name: Describe the Android emulator
        if: (failure() || cancelled()) && matrix.platform == 'Android'
        uses: ./.github/actions/android-emulator-state

      # A job that failed says so beside its results, so the nightly report finds a failure outside the checks too; a job
      # that ran out of time is cancelled rather than failed, and says so as well.
      - name: Note the job's failure
        if: failure() || cancelled()
        shell: pwsh
        run: New-Item -ItemType File -Force -Path 'artifacts/browser/mobile-results/job-failed' | Out-Null

      - name: Keep the checks' results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: checks-mobile-linux-1
          path: artifacts/browser/mobile-results
          if-no-files-found: ignore
          retention-days: 14

  # Every component in an Android web view, the Android check host's on an emulator, beside the browser check's
  # browsers and WebView2.
  android:
    name: components on Android
    needs: commit
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.commit.outputs.sha }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # The Android check host builds against the maui-android workload, which the SDK set up above comes without.
      - name: Install the MAUI workload
        env:
          TMPDIR: ${{ runner.temp }}
        run: dotnet workload install maui-android

      - name: Start an Android emulator
        uses: ./.github/actions/android-emulator

      # The gate's jobs check the components in every other runtime, so this one checks them on Android alone.
      - name: Check the components on Android
        run: pwsh ./scripts/build/browser.ps1 -Android -Filter 'Runtime=android'

      # A device that went unreachable is described where it happened: its process, the runner's memory and its log.
      - name: Describe the Android emulator
        if: failure() || cancelled()
        uses: ./.github/actions/android-emulator-state

      # A job that failed says so beside its results, so the nightly report finds a failure outside the checks too; a job
      # that ran out of time is cancelled rather than failed, and says so as well.
      - name: Note the job's failure
        if: failure() || cancelled()
        shell: pwsh
        run: New-Item -ItemType File -Force -Path 'artifacts/browser/results/job-failed' | Out-Null

      - name: Keep the checks' results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: checks-android-linux-1
          path: artifacts/browser/results
          if-no-files-found: ignore
          retention-days: 14

  # The nightly run's report, made whatever the jobs before it did: every run's results read together, each failing check
  # filed as an issue, an unreachable device as one, and a job that failed outside its checks as one of its own.
  report:
    name: report
    needs: [commit, gate, mobile, android]
    # A run cancelled as a whole files nothing; a job of it that ran out of time is reported as failed.
    if: always() && !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.commit.outputs.sha }}

      - name: Gather the checks' results
        uses: actions/download-artifact@v8
        with:
          pattern: checks-*
          path: results

      - name: File what failed
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ needs.commit.outputs.sha }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: ./scripts/Update-CheckIssue.ps1 -Results results -Commit $env:COMMIT -Run $env:RUN -Repository $env:REPOSITORY
