# Publishes a release from its signed annotated vX.Y.Z tag, which marks the commit promoted to main. Versioning's
# release check holds the tag to the release rules first; the packages the candidate's full run packed and checked are
# then attached to the tag's GitHub release with their digests, and published from there, each after the packages it
# depends on, to nuget.org and to the organization's GitHub feed. A publication that stops partway runs again for the
# same tag and publishes what the feeds lack.
name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  # The release's packages are attached to its GitHub release.
  contents: write
  # The candidate's full run and the packages it kept are read.
  actions: read
  # The promotion's pull request is read.
  pull-requests: read
  # The packages are pushed to the organization's feed.
  packages: write
  # nuget.org exchanges the run's OIDC token for a key that lasts an hour, through its trusted publishing policy for this
  # workflow.
  id-token: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest

    steps:
      # The whole history, so the check reads main's as the repository holds it.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Hold the tag to the release check
        id: check
        uses: FormaUI/Versioning/actions/release-check@fa6f941871694adb8898c8263a22ec150eb2eef9 # v1.0.0-preview.4
        with:
          gate-workflow: full.yml
          packages-artifact: packages
          version-command: |
            $properties = [xml](Get-Content Directory.Build.props -Raw)
            $prefix = $properties.SelectSingleNode('//PropertyGroup/VersionPrefix').InnerText
            $suffix = $properties.SelectSingleNode('//PropertyGroup/VersionSuffix').InnerText
            if ($suffix) { "$prefix-$suffix" } else { $prefix }

      - name: Attach the release's packages
        id: packages
        uses: FormaUI/Versioning/actions/release-packages@fa6f941871694adb8898c8263a22ec150eb2eef9 # v1.0.0-preview.4
        with:
          gate-run-id: ${{ steps.check.outputs.gate-run-id }}
          packages-artifact: packages
          name: Forma

      # The pinned SDK pushes the packages.
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # The user is the nuget.org account that made the policy.
      - name: Get a nuget.org key
        id: login
        uses: NuGet/login@v1
        with:
          user: soyeyalon

      - name: Publish to nuget.org
        uses: FormaUI/Versioning/actions/publish-packages@fa6f941871694adb8898c8263a22ec150eb2eef9 # v1.0.0-preview.4
        with:
          directory: ${{ steps.packages.outputs.directory }}
          nuget-source: https://api.nuget.org/v3/index.json
          nuget-api-key: ${{ steps.login.outputs.NUGET_API_KEY }}

      # The organization's feed takes no symbols packages.
      - name: Publish to the organization's GitHub feed
        uses: FormaUI/Versioning/actions/publish-packages@fa6f941871694adb8898c8263a22ec150eb2eef9 # v1.0.0-preview.4
        with:
          directory: ${{ steps.packages.outputs.directory }}
          nuget-source: https://nuget.pkg.github.com/FormaUI/index.json
          nuget-api-key: ${{ github.token }}
          nuget-symbols: 'false'
