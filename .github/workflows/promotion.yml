# Holds main to the promotion rule: a pull request into main comes from this repository's candidate, whose full run
# passed on its head commit and kept its packages, at a release version every feed lacks, with its changelog entry
# dated. Versioning's promotion check makes each check and names the route to take where one fails, whichever base
# the pull request was opened against or later moved to, so the check is required of main.
name: Promotion

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches: [main]

permissions:
  contents: read
  # The candidate's full run and the packages it kept are read.
  actions: read
  pull-requests: read

jobs:
  promotion:
    name: promotion
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Hold the pull request to the promotion check
        uses: FormaUI/Versioning/actions/promotion-check@542a3721f43fb4c375ea5e8165aeab85cc631918 # v1.0.0-preview.3
        with:
          gate-workflow: full.yml
          packages-artifact: packages
          version-command: |
            $properties = [xml](Get-Content Directory.Build.props -Raw)
            $prefix = $properties.SelectSingleNode('//PropertyGroup/VersionPrefix').InnerText
            $suffix = $properties.SelectSingleNode('//PropertyGroup/VersionSuffix').InnerText
            if ($suffix) { "$prefix-$suffix" } else { $prefix }
