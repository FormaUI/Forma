# Checks every component in an Android web view, the Android check host's on an emulator, as the gate checks each in a
# browser and in WebView2. A run boots the emulator and takes the whole browser step beside it, longer than a push
# should wait for, so it runs on a schedule and on demand, and gates nothing.
name: Android

on:
  schedule:
    # Monday morning, UTC, an hour after the canary.
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  # The locale lint is a tool the organization publishes to its own private feed.
  packages: read

jobs:
  android:
    name: components on Android
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # The Android check host builds against the maui-android workload, which the SDK set up above comes without.
      - name: Install the MAUI workload
        run: dotnet workload install maui-android

      - name: Start an Android emulator
        uses: ./.github/actions/android-emulator

      - name: Check the components on Android
        env:
          NuGetPackageSourceCredentials_formaui: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }}
        run: pwsh ./scripts/build/browser.ps1 -Android
