# Runs the fast gate a person runs while working, on Linux, for every push but main's and candidate's and for every pull
# request into dev, so a feature's branch, its pull request and the integrated dev commit are each checked once. The
# gate itself lives in the repository, not here, so the two cannot drift: this file installs a toolchain and invokes
# one script.
name: Fast

on:
  push:
    branches-ignore: [main, candidate]
  # A pull request moved to dev is edited, so it is checked against dev as it moves; a title's edit runs the gate again
  # rather than skipping it, since a skipped run would satisfy the required check over a failed one.
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A run superseded before it finished is answering about a tree that no longer exists, whichever branch
  # it was on. Pushes arrive in bursts here, so canceling is what keeps the gate reporting on the commit
  # anyone is actually waiting for. The cost is that a commit passed over mid-burst is never judged on its
  # own, which matters only to a bisect that reaches for it later.
  cancel-in-progress: true

permissions:
  contents: read
  # On a pull request the change detection below reads the changed files through the API rather than
  # from git, which this scope is what allows.
  pull-requests: read

jobs:
  # The unit and bUnit suites built once and run, the script tests and the task programs' tests: the feedback a routine
  # push waits for, measured here from the job's start, setup and restore included.
  fast:
    name: fast (ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # A file is code unless it is prose nothing reads or packs: a README and a notices file are code, since a package
      # carries them and a check holds the root README's examples to the example hosts. Every pattern must match, so the
      # exclusions narrow the first.
      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**/*'
              - '!**/!(README|THIRD-PARTY-NOTICES).md'
              - '!docs/**'
              - '!assets/**'
              - '!.github/ISSUE_TEMPLATE/**'

      - name: Set up .NET
        if: steps.filter.outputs.code == 'true'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # The packages the suites restore, kept between runs under the files that name their versions, so a run restores
      # only what changed.
      - name: Cache the NuGet packages
        if: steps.filter.outputs.code == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-fast-${{ runner.os }}-${{ hashFiles('global.json', '**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-fast-${{ runner.os }}-

      - name: Set up Node
        if: steps.filter.outputs.code == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/scripts/package-lock.json

      - name: Run the fast gate
        if: steps.filter.outputs.code == 'true'
        run: pwsh ./build.ps1 Fast

      - name: Report the gate was not needed
        if: steps.filter.outputs.code != 'true'
        run: echo 'Only prose changed, so the gate did not need to run.'
