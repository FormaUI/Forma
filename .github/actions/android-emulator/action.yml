name: Start an Android emulator
description: Installs the Android environment .config/android.json declares and boots its emulator, accelerated by the runner's KVM, on its console port, for adb to reach.

runs:
  using: composite
  steps:
    - name: Start an Android emulator
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
        ls -l /dev/kvm
        adb="$ANDROID_HOME/platform-tools/adb"
        # The image leaves a few gigabytes free, less than a virtual device's data partition and the build after it need, so
        # the toolchains no Forma job uses make the room.
        sudo rm -rf /usr/share/swift /usr/local/.ghcup /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/CodeQL" "$ANDROID_HOME/ndk"
        docker image prune --all --force > /dev/null
        # The environment is the one every machine installs: its JDK, its packages and its emulator, whose name, console port
        # and virtual devices' folder the boot below reads back.
        pwsh -NoProfile -File ./scripts/Install-Android.ps1
        read -r name port avds < <(pwsh -NoProfile -Command '$e = (Get-Content -LiteralPath .config/android.json -Raw | ConvertFrom-Json).emulator; "{0} {1} {2}" -f $e.name, $e.port, (Join-Path $PWD ".sandbox" "android" "avd")')
        export ANDROID_AVD_HOME="$avds"
        serial="emulator-$port"
        "$ANDROID_HOME/emulator/emulator" -list-avds | grep -x "$name"
        "$ANDROID_HOME/emulator/emulator" -accel-check
        df -h "$ANDROID_AVD_HOME"
        # The emulator's exit status closes its log, so an emulator that drops mid-run says how, a signal among them. The
        # runner has two cores and no GPU, which the emulator is told rather than left to find.
        nohup bash -c '"$@"; echo "The emulator exited with status $?."' emulator "$ANDROID_HOME/emulator/emulator" -avd "$name" -port "$port" -no-window -no-audio -no-boot-anim -no-metrics -gpu swiftshader_indirect -no-snapshot -partition-size 4096 -cores 2 -memory 4096 > "$RUNNER_TEMP/emulator.log" 2>&1 &
        booted() { [ "$("$adb" -s "$serial" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; }
        timeout 300 "$adb" -s "$serial" wait-for-device || true
        for attempt in $(seq 1 120); do booted && break; sleep 5; done
        if ! booted; then
          echo 'The emulator never finished booting; its log:'
          tail -n 80 "$RUNNER_TEMP/emulator.log"
          exit 1
        fi
        "$adb" -s "$serial" shell getprop ro.build.version.release
